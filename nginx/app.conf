# ==============================================================================
# NGINX App Server Configuration
# SentinelFlow SPA + API Reverse Proxy
#
# Place this file at: nginx/app.conf
# Used by the web Dockerfile Stage 2 runner.
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ─── Security Headers ──────────────────────────────────────────────────────
    # Helmet (NestJS) handles headers for /api routes.
    # These headers protect the SPA static assets.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Static Asset Cache ────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── API Reverse Proxy ─────────────────────────────────────────────────────
    # Proxies /api/* and /socket.io/* to the NestJS backend.
    # The API_URL env var must be set in docker-compose.prod.yml.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ─── WebSocket Proxy ───────────────────────────────────────────────────────
    # Required for Socket.IO /events namespace upgrade
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;  # Keep WS connections alive
        proxy_send_timeout 86400s;
    }

    # ─── Health Check (container orchestration) ────────────────────────────────
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }

    # ─── SPA Fallback (React Router) ───────────────────────────────────────────
    # All unmatched paths return index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
